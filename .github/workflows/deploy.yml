# Deploy to an AWS account: build and push the utility image, then `sam deploy`.
#
# Two ways to run it, both by hand; it never runs on pushes or pull requests:
#
#   workflow_dispatch  from this repository's Actions tab, against one of its environments.
#   workflow_call      from a workflow in another (private) repository, which supplies the
#                      environment. The run, its logs and its summary then live in that
#                      repository, so account IDs, ARNs and bucket names never appear in
#                      this repository's public logs. docs/deploy-caller.yml is the caller.
#
# Either way the GitHub environment (e.g. `dev`, `prod`) belongs to the repository the run
# starts in, and holds:
#   variables  AWS_REGION, AWS_DEPLOY_ROLE_ARN, UTILITY_ECR_REPOSITORY, STACK_NAME, APP_NAME,
#              CPU_JOB_QUEUE_ARN, GPU_JOB_QUEUE_ARN (may be empty),
#              PLATFORM (linux/arm64 or linux/amd64; must match the CPU queue's instances),
#              S3_ACCESS_LOG_BUCKET (optional; required where guardrails demand S3 access logging)
# AWS_DEPLOY_ROLE_ARN is a role that trusts GitHub's OIDC provider for that repository and
# can push to the ECR repository and run CloudFormation for the stack. No AWS keys are stored.
#
# This is also the reference for plugging this repo into another deployment system: the whole
# contract is the two steps "build and push the image" and "sam deploy with these parameters".

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the target account's settings
        type: environment
        required: true
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (in the calling repository) holding the target account's settings
        type: string
        required: true

permissions:
  id-token: write # OIDC token for assuming the AWS role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # When called from another repository, the github context (and so checkout's
          # defaults) is the *caller's*. The job context names the repository and commit of
          # the workflow file itself, whether called or dispatched here, so this always
          # builds this repository at this commit. (job.workflow_* is github.com only.)
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0 # full history, so `git describe` can name the build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build and push the utility image
        # Two tags for the same image: a readable one from `git describe` (exactly the release
        # tag when deploying a tag, e.g. v0.2.0; otherwise v0.1.0-5-gabc1234, "five commits past
        # v0.1.0") and the full commit SHA for exact traceability. The stack is pointed at the
        # digest, so tags are labels for humans.
        env:
          PLATFORM: ${{ vars.PLATFORM || 'linux/arm64' }}
        run: |
          export IMAGE_TAG="$(git describe --tags --always)"
          scripts/build_image.sh --push "${{ vars.UTILITY_ECR_REPOSITORY }}" \
            --also-tag "$(git rev-parse HEAD)" --output image-uri.txt

      - name: Deploy the stack
        env:
          GPU_JOB_QUEUE_ARN: ${{ vars.GPU_JOB_QUEUE_ARN }}
          S3_ACCESS_LOG_BUCKET: ${{ vars.S3_ACCESS_LOG_BUCKET }}
        run: |
          # SAM rejects an empty parameter value, so only pass the GPU queue when there is one
          OVERRIDES=("AppName=${{ vars.APP_NAME }}"
                     "CPUJobQueueArn=${{ vars.CPU_JOB_QUEUE_ARN }}"
                     "UtilityImageUri=$(cat image-uri.txt)")
          if [ -n "$GPU_JOB_QUEUE_ARN" ]; then OVERRIDES+=("GPUJobQueueArn=$GPU_JOB_QUEUE_ARN"); fi
          if [ -n "$S3_ACCESS_LOG_BUCKET" ]; then OVERRIDES+=("S3AccessLogBucketName=$S3_ACCESS_LOG_BUCKET"); fi
          sam build
          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"

      - name: Summary
        run: |
          {
            echo "### Deployed \`${{ vars.STACK_NAME }}\` to \`${{ inputs.environment }}\`"
            echo
            echo "- Image: \`$(cat image-uri.txt)\`"
            echo "- Commit: \`$(git rev-parse HEAD)\` ($(git describe --tags --always))"
            echo
            echo "Stack outputs:"
            echo '```'
            aws cloudformation describe-stacks --stack-name "${{ vars.STACK_NAME }}" \
              --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
