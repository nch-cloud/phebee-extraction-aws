AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Prerequisites for phebee-extraction-aws's GitHub Actions workflow (.github/workflows/deploy.yml):
  the deploy role and the bucket SAM uploads the packaged template to. Deployed once per target
  account, by hand, before the first run of the workflow. The role trusts GitHub's OIDC provider
  for one repository and one GitHub environment, so only a run of that environment in that
  repository can assume it. No AWS keys are stored in GitHub.

Parameters:
  GitHubRepository:
    Type: String
    Description: >
      The repository whose Actions runs may deploy, exactly as GitHub writes it in the OIDC
      subject. Repositories created after 15 July 2026 use an immutable subject that embeds the
      owner and repository IDs, e.g. my-org@188507437/my-deploy-repo@1440223880; older ones use
      plain owner/name. Read the exact value with
      `gh api /repos/<owner>/<repo>/actions/oidc/customization/sub` (the sub_claim_prefix, minus
      its leading "repo:"). If the deploy workflow is called from a separate deploy repository
      (docs/deploy-caller.yml), name that repository: the subject is the repository a run
      starts in.
    AllowedPattern: "^[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?$"
  GitHubEnvironment:
    Type: String
    Description: The GitHub environment whose runs may assume this role, e.g. dev or prod. One role per environment.
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  AppName:
    Type: String
    Default: phebee-extraction
    Description: Same AppName the stack is deployed with; scopes what the role may create.
  StackName:
    Type: String
    Default: phebee-extraction-aws
    Description: Name of the application stack the workflow deploys.
  UtilityEcrRepositoryName:
    Type: String
    Default: phebee-extraction-aws
    Description: ECR repository the workflow pushes the utility image to (must already exist).
  CreateOidcProvider:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Create the GitHub OIDC identity provider. An account has at most one; set true only if
      no other workflow in this account already deploys from GitHub Actions.
  ArtifactBucketName:
    Type: String
    Default: ""
    Description: >
      Optional. An existing bucket for SAM to upload the packaged template to, for example an
      organisation-wide CloudFormation artifacts bucket. The role may read and write only under
      the prefix named after the application stack. Leave empty to have this stack create a
      bucket of its own, {AppName}-deploy-{account}-{region}.
  S3AccessLogBucketName:
    Type: String
    Default: ""
    Description: >
      Optional, used only when this stack creates the artifact bucket. An existing bucket to
      receive its server access logs; set it where CloudFormation guardrails require S3 access
      logging (CIS), the same value as the application stack's parameter of the same name.
  S3AccessLogPrefix:
    Type: String
    Default: phebee-extraction-deploy-access-logs/
    Description: Prefix for the access logs in that bucket.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  ShouldCreateArtifactBucket: !Equals [!Ref ArtifactBucketName, ""]
  ShouldEnableS3Logging: !Not [!Equals [!Ref S3AccessLogBucketName, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # GitHub's root CA thumbprint. AWS now verifies GitHub's certificate itself, so this
      # value is retained for compatibility rather than relied on.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # Where `sam deploy --s3-bucket` uploads the packaged template (the state machine definition
  # is a file), unless an existing bucket is named in ArtifactBucketName. SAM's own
  # `--resolve-s3` would instead create and keep updating a shared aws-sam-cli-managed-default
  # stack, which needs account-wide permissions this role does not have and a bucket without
  # access logging that guardrail hooks reject.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateArtifactBucket
    Properties:
      BucketName: !Sub "${AppName}-deploy-${AWS::AccountId}-${AWS::Region}"
      LoggingConfiguration: !If
        - ShouldEnableS3Logging
        - DestinationBucketName: !Ref S3AccessLogBucketName
          LogFilePrefix: !Ref S3AccessLogPrefix
        - !Ref AWS::NoValue
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-deploy-${GitHubEnvironment}"
      Description: !Sub "Assumed by GitHub Actions deploy runs of ${GitHubRepository}, environment ${GitHubEnvironment}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only a run targeting this environment, in this repository. A fork, another
                # repository, a pull request, or a run against another environment presents a
                # different `sub` and is refused.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: PushUtilityImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${UtilityEcrRepositoryName}"

        - PolicyName: DeployStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation on this stack only
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Effect: Allow
                Action: cloudformation:ListStacks
                Resource: "*"
              # Upload the packaged template to the artifact bucket (sam deploy --s3-bucket
              # --s3-prefix <StackName>): the whole bucket if this stack created it, otherwise
              # only this stack's prefix in the shared bucket.
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !If
                  - ShouldCreateArtifactBucket
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !If
                  - ShouldCreateArtifactBucket
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}/${StackName}/*"

        - PolicyName: ManageStackResources
          # What CloudFormation creates on the role's behalf, scoped to this application's names
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:aws:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${AppName}*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/${AppName}-*"
              - Effect: Allow
                Action:
                  - batch:RegisterJobDefinition
                  - batch:DeregisterJobDefinition
                  - batch:DescribeJobDefinitions
                Resource: "*"
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:UpdateStateMachine
                  - states:DeleteStateMachine
                  - states:DescribeStateMachine
                  - states:TagResource
                  - states:UntagResource
                  - states:ListTagsForResource
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AppName}-*"
              # The stack's own IAM roles. Scoped to the application's role names so this deploy
              # role cannot create arbitrary roles.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppName}-*"

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN variable of the GitHub environment.
    Value: !GetAtt DeployRole.Arn
  TrustedSubject:
    Description: The exact OIDC subject this role trusts.
    Value: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
  ArtifactBucketName:
    Description: Set this as the SAM_ARTIFACT_BUCKET variable of the GitHub environment.
    Value: !If [ShouldCreateArtifactBucket, !Ref ArtifactBucket, !Ref ArtifactBucketName]
