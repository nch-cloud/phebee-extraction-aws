[project]
name = "phebee-extraction-aws"
version = "0.1.0"
description = "AWS (Step Functions + Batch) deployment of phebee-extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "NCH Cloud" }]
keywords = ["phenotype", "extraction", "clinical", "hpo", "aws", "step-functions", "aws-batch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # The core: loading, batching, the container contract and the PheBee transform.
    # Resolved from the git tag in [tool.uv.sources]; a plain name here lets the Docker build
    # satisfy it from a pre-built wheel instead of cloning.
    "phebee-extraction>=1.0,<2",
    "boto3>=1.34",
]

[tool.uv.sources]
phebee-extraction = { git = "https://github.com/nch-cloud/phebee-extraction.git", tag = "v1.0.0" }

[project.scripts]
phebee-extract-aws = "phebee_extraction_aws.cli:main"

[project.urls]
Homepage = "https://github.com/nch-cloud/phebee-extraction-aws"
Repository = "https://github.com/nch-cloud/phebee-extraction-aws"
Core = "https://github.com/nch-cloud/phebee-extraction"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "pyyaml>=6.0",  # tests parse template.yaml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phebee_extraction_aws"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
